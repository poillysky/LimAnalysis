# LimAnalysis 应用单独部署（一体镜像，不含 Postgres）
# 数据根：/vol1/1000/Docker/limana
# 三库沿用：deploy/docker-compose.nas.yml（LimAnalysis）
#
# 准备：
#   mkdir -p /vol1/1000/Docker/limana/{meta,raw,zsj,zdwg}
#
# 启动（无需 .env）：
#   docker compose -f docker-compose.limana.yml pull
#   docker compose -f docker-compose.limana.yml up -d
#
# 访问：http://<NAS>:18088
# 图片目录（功能管理）：注塑机 /data/photos/zsj ；自动外观 /data/photos/zdwg
# PG 连不上时，把下面 host.docker.internal 改成 NAS 局域网 IP

name: limana

x-app-env: &app-env
  TZ: Asia/Shanghai
  APP_NAME: LimAnalysis API
  API_PREFIX: /api/v1
  CORS_ORIGINS: http://127.0.0.1:18088,http://localhost:18088
  WORKSHOP_OFFLINE: "true"
  META_SQLITE_PATH: /data/meta/lim_meta.sqlite
  RAW_DATABASE_URL: postgresql+psycopg://lim:lim@host.docker.internal:15432/lim_raw
  DWH_DATABASE_URL: postgresql+psycopg://lim:lim@host.docker.internal:15433/lim_dwh
  DEFECT_DATABASE_URL: postgresql+psycopg://lim:lim@host.docker.internal:15434/lim_defect

x-app-volumes: &app-volumes
  - /vol1/1000/Docker/limana/meta:/data/meta
  - /vol1/1000/Docker/limana/raw:/data/raw
  - /vol1/1000/Docker/limana/zsj:/data/photos/zsj
  - /vol1/1000/Docker/limana/zdwg:/data/photos/zdwg

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  app:
    image: poillysky/limanalysis:V1.0.1
    container_name: limana-app
    restart: unless-stopped
    mem_limit: 1536m
    command: ["app"]
    extra_hosts: *extra-hosts
    environment:
      <<: *app-env
    volumes: *app-volumes
    ports:
      - "18088:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s

  collector:
    image: poillysky/limanalysis:V1.0.1
    container_name: limana-collector
    restart: unless-stopped
    mem_limit: 1g
    command: ["collector"]
    depends_on:
      app:
        condition: service_healthy
    extra_hosts: *extra-hosts
    environment:
      <<: *app-env
    volumes: *app-volumes
    healthcheck:
      disable: true

  agg:
    image: poillysky/limanalysis:V1.0.1
    container_name: limana-agg
    restart: unless-stopped
    mem_limit: 1g
    command: ["agg"]
    depends_on:
      app:
        condition: service_healthy
    extra_hosts: *extra-hosts
    environment:
      <<: *app-env
    volumes: *app-volumes
    healthcheck:
      disable: true
