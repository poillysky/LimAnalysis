# NAS 部署：三套独立 Postgres + Adminer（可读写，可嵌入前端）
# 数据目录：
#   /vol1/1000/Docker/LimAnalysis/lim-raw
#   /vol1/1000/Docker/LimAnalysis/lim-dwh
#   /vol1/1000/Docker/LimAnalysis/lim-defect
#   /vol1/1000/Docker/LimAnalysis/meta
#   /vol1/1000/Docker/LimAnalysis/metabase
#   /vol1/1000/Docker/LimAnalysis/dbweb/nginx.conf   （需是文件，不要目录）
# 启动：
#   docker compose -f docker-compose.nas.yml up -d
# Adminer：http://<NAS>:18080
# Metabase（开源）：http://<NAS>:13000
#   数据源填 Host=postgres-dwh  Port=5432  库=lim_dwh  用户/密码=lim/lim
#   看板只选视图 v_*_ads_3h（宽表；不良项对比用卡片内自定义 SQL unpivot）
# 次品库：Host=postgres-defect  Port=5432  库=lim_defect（宿主机端口 15434）
#
# 应用进程（本机或另容器，不在此文件）：
#   1) uvicorn app.main:app --port 8000          # 主 API
#   2) python -m collector.worker                # 采集/清洗 Worker
#   3) python -m processor.agg_worker            # 数据聚合 Worker
# Worker 需与 API 共用同一 meta SQLite，并能访问 raw PG（15432）。

# 内存：Metabase 最吃 RAM；三库各限 1G；NAS 内存紧可再下调
services:
  postgres-raw:
    image: postgres:16-alpine
    container_name: lim-raw
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: lim
      POSTGRES_PASSWORD: lim
      POSTGRES_DB: lim_raw
      TZ: Asia/Shanghai
      # 小实例：降低 shared_buffers，避免三库各抢一大块缓存
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=80
    volumes:
      - /vol1/1000/Docker/LimAnalysis/lim-raw:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lim -d lim_raw"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-dwh:
    image: postgres:16-alpine
    container_name: lim-dwh
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "15433:5432"
    environment:
      POSTGRES_USER: lim
      POSTGRES_PASSWORD: lim
      POSTGRES_DB: lim_dwh
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=80
    volumes:
      - /vol1/1000/Docker/LimAnalysis/lim-dwh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lim -d lim_dwh"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-defect:
    image: postgres:16-alpine
    container_name: lim-defect
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "15434:5432"
    environment:
      POSTGRES_USER: lim
      POSTGRES_PASSWORD: lim
      POSTGRES_DB: lim_defect
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=192MB
      - -c
      - max_connections=40
    volumes:
      - /vol1/1000/Docker/LimAnalysis/lim-defect:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lim -d lim_defect"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: lim-adminer
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      postgres-raw:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
      postgres-defect:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres-raw
      ADMINER_DESIGN: pepa-linha
      TZ: Asia/Shanghai
    volumes:
      - /vol1/1000/Docker/LimAnalysis/meta:/data/meta
    expose:
      - "8080"

  adminer-proxy:
    image: nginx:alpine
    container_name: lim-adminer-proxy
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - adminer
    ports:
      - "18080:80"
    volumes:
      - /vol1/1000/Docker/LimAnalysis/dbweb/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  metabase:
    image: metabase/metabase:v0.55.24.x
    container_name: lim-metabase
    restart: unless-stopped
    mem_limit: 1536m
    depends_on:
      postgres-dwh:
        condition: service_healthy
    ports:
      - "13000:3000"
    environment:
      TZ: Asia/Shanghai
      JAVA_TIMEZONE: Asia/Shanghai
      MB_DB_FILE: /metabase-data/metabase.db
      # 防止 JVM 默认吃光 NAS 内存导致整机卡死
      JAVA_OPTS: "-Xms256m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    volumes:
      - /vol1/1000/Docker/LimAnalysis/metabase:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
