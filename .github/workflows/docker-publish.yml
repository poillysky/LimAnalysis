# 打标签 V* / v* 或手动触发 → 构建并推送到 Docker Hub
# Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB       = Docker Hub 用户名（你已创建）
#   DOCKERHUB_TOKEN = Docker Hub Access Token（需再建；权限 Read & Write）

name: Publish Docker Hub

on:
  push:
    tags:
      - "V*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 V1.0.0）"
        required: true
        default: "V1.0.0"

permissions:
  contents: read

env:
  FRONTEND_IMAGE: limanalysis-frontend
  BACKEND_IMAGE: limanalysis-backend

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using tag: ${TAG}"

      - name: Check Docker Hub secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DOCKERHUB }}" ]; then
            echo "::error::缺少 secret DOCKERHUB（Docker Hub 用户名）"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::缺少 secret DOCKERHUB_TOKEN（Docker Hub Access Token）。请在仓库 Settings → Secrets 新建。"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB }}/${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        shell: bash
        run: |
          U="${{ secrets.DOCKERHUB }}"
          T="${{ steps.meta.outputs.tag }}"
          {
            echo "## Docker Hub"
            echo "- \`${U}/${{ env.FRONTEND_IMAGE }}:${T}\`"
            echo "- \`${U}/${{ env.BACKEND_IMAGE }}:${T}\`"
            echo "- 同时推送了 \`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
