# 打标签 V* / v* 或手动触发 → 构建一体镜像并推送到 Docker Hub
# Secrets：
#   DOCKERHUB      = Docker Hub Access Token
#   DOCKERHUB_USER = Docker Hub 用户名（可选；默认 github.repository_owner）

name: Publish Docker Hub

on:
  push:
    tags:
      - "V*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 V1.0.6）"
        required: true
        default: "V1.0.6"

permissions:
  contents: read

env:
  IMAGE_NAME: limanalysis

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          USER="${{ secrets.DOCKERHUB_USER }}"
          if [ -z "$USER" ]; then
            USER="${{ github.repository_owner }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "user=${USER}" >> "$GITHUB_OUTPUT"
          echo "Using tag=${TAG} user=${USER}"

      - name: Check Docker Hub secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DOCKERHUB }}" ]; then
            echo "::error::缺少 secret DOCKERHUB（填 Docker Hub Access Token）"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.meta.outputs.user }}
          password: ${{ secrets.DOCKERHUB }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 关闭 attestation / SBOM，避免打成 OCI index（旧 Synology load 易解大层失败）
          provenance: false
          sbom: false
          # docker 媒体类型 + gzip，贴近旧引擎可 load 的格式（勿与顶层 push/tags 混用）
          outputs: |
            type=image,name=${{ steps.meta.outputs.user }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }},push=true,oci-mediatypes=false,compression=gzip,force-compression=true
            type=image,name=${{ steps.meta.outputs.user }}/${{ env.IMAGE_NAME }}:latest,push=true,oci-mediatypes=false,compression=gzip,force-compression=true
          # 优先复用 V1.0.3 已验证可被旧 NAS load 的底层（python/apt/pip）
          cache-from: |
            type=registry,ref=${{ steps.meta.outputs.user }}/${{ env.IMAGE_NAME }}:V1.0.3
            type=gha
          cache-to: type=gha,mode=max
          # 单平台，避免 index/多架构干扰旧引擎
          platforms: linux/amd64

      - name: Summary
        shell: bash
        run: |
          U="${{ steps.meta.outputs.user }}"
          T="${{ steps.meta.outputs.tag }}"
          {
            echo "## Docker Hub"
            echo "- \`${U}/${{ env.IMAGE_NAME }}:${T}\`"
            echo "- 同时推送了 \`:latest\`"
            echo "- 角色：\`app\` / \`api\` / \`collector\` / \`agg\`"
          } >> "$GITHUB_STEP_SUMMARY"
